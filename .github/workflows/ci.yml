name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    name: regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      VOXMASTER_DATA: ${{ runner.temp }}/voxmaster-test
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0
      - if: runner.os == 'macOS'
        run: brew install portaudio
      - run: python -m pip install -r requirements.txt ruff==0.14.5
      - run: python scripts/version.py
      - run: ruff check --select F --ignore F841 vox app.py scripts/version.py scripts/release_assets.py
      - run: python -m compileall -q vox app.py
      - run: python -m pytest -q --junitxml=results.xml
      - run: python app.py --cli analyze tests/fixtures/fleurs-mandarin.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: results.xml
