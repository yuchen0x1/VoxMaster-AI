name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    name: regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      VOXMASTER_DATA: ${{ github.workspace }}/.voxmaster-test-data
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0
      - if: runner.os == 'macOS'
        run: brew install portaudio
      - run: python -m pip install -r requirements.txt ruff==0.14.5
      - run: python scripts/version.py
      - run: ruff check --select F --ignore F841 vox app.py scripts/version.py scripts/release_assets.py
      - run: python -m compileall -q vox app.py
      - run: python -X faulthandler -m pytest -q --junitxml=results.xml
      - run: python app.py --cli analyze tests/fixtures/fleurs-mandarin.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: results.xml
  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download pinned actionlint and verify its published SHA-256
        run: |
          curl --retry 4 --fail --silent --show-error --location \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - run: /tmp/actionlint -version
      - run: /tmp/actionlint
