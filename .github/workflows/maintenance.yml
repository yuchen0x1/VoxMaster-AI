name: Upstream research
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.34.2
      - run: python scripts/research.py --output upstreams.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/research_recent.py --output recent-upstreams.json --window-days 90
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-evidence
          path: |
            upstreams.json
            recent-upstreams.json
          retention-days: 90
