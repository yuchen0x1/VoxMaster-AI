name: Upstream research
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.34.2
      - run: python scripts/research.py --output upstreams.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/research_recent.py --output recent-upstreams.json --window-days 90
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-evidence
          path: |
            upstreams.json
            recent-upstreams.json
          retention-days: 90
