name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: '正式公开发布（默认仅构建候选包）'
        type: boolean
        default: false
      confirm_tag:
        description: '发布时完整填写当前 tag，例如 v0.4.0；必须从该 tag 运行'
        type: string
        default: ''
      listening_approved:
        description: '制作人已完成人工等响听审并批准此版本'
        type: boolean
        default: false
      accept_limitations:
        description: '已接受发行说明中的未签名和未验收平台等限制'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      VOXMASTER_DATA: ${{ github.workspace }}/.voxmaster-package-test-data
    steps:
      - name: Require explicit stable publication approval
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
          LISTENING_APPROVED: ${{ inputs.listening_approved }}
          ACCEPT_LIMITATIONS: ${{ inputs.accept_limitations }}
        run: |
          if ($env:CONFIRM_TAG -cne $env:GITHUB_REF_NAME -or
              $env:LISTENING_APPROVED -ne 'true' -or $env:ACCEPT_LIMITATIONS -ne 'true') {
            throw 'Stable publication requires the exact tag, completed listening approval and explicit acceptance of limitations'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag commit is reachable from main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $status = gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$env:GITHUB_SHA" --jq .status
          if ($LASTEXITCODE -ne 0) { throw 'Unable to compare tag commit with main' }
          if ($status -notin @('behind', 'identical')) {
            throw "Release tag is not contained in main (compare status: $status)"
          }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc curl tar xz zstd
      - shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt
          .venv/Scripts/python scripts/version.py --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE) { throw 'Version/tag mismatch' }
          if (-not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --no-progress -y
          }
          $bash = (Get-ChildItem "$env:RUNNER_TEMP/msys64/usr/bin/bash.exe","D:/a/_temp/msys64/usr/bin/bash.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $bash) { throw 'MSYS2 bash not found' }
          $innoLanguages = 'C:/Program Files (x86)/Inno Setup 6/Languages'
          if (-not (Test-Path "$innoLanguages/ChineseSimplified.isl")) {
            # Older Inno Setup 6 builds ship without it; fetch the file pinned to
            # an issrc commit and verify its SHA-256 before installing.
            curl --retry 4 --fail --silent --show-error --location `
              --output "$env:RUNNER_TEMP/ChineseSimplified.isl" `
              https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files/Languages/ChineseSimplified.isl
            $expected = 'e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d'
            $actual = (Get-FileHash "$env:RUNNER_TEMP/ChineseSimplified.isl" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw 'ChineseSimplified.isl checksum mismatch' }
            Copy-Item "$env:RUNNER_TEMP/ChineseSimplified.isl" "$innoLanguages/ChineseSimplified.isl"
          }
          ./scripts/build.ps1 -Bash $bash
          if ($LASTEXITCODE) { throw 'Windows build failed' }
      - name: Verify isolated installation, portable runtime and uninstall
        shell: pwsh
        run: ./scripts/verify-release.ps1 -IsolatedRegistration
      - name: Prepare signed stable update assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .venv/Scripts/python scripts/release_assets.py
      - name: Publish explicitly approved stable release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --latest=false --title "VoxMaster AI $env:GITHUB_REF_NAME" --notes-file docs/releases/release-notes.md
          if ($LASTEXITCODE) { throw 'Release creation failed' }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist/release -File).FullName
          if ($LASTEXITCODE) { throw 'Asset upload failed; release remains a draft' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest=true
          if ($LASTEXITCODE) { throw 'Release publication failed' }
      - name: Verify the exact published version through the public update channel
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: |
          # A cached older manifest must not pass as verification of this version.
          $ok = $false
          $version = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($i in 1..5) {
            .venv/Scripts/python scripts/verify_release.py --expected-version $version --download
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($i -lt 5) { Start-Sleep -Seconds 60 }
          }
          if (-not $ok) { throw 'Exact published update manifest or installer verification failed; inspect the release manually' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-candidate
          if-no-files-found: error
          path: |
            dist/VoxMasterAI-Setup.exe
            dist/VoxMasterAI-Portable.zip
            dist/VoxMasterAI-Source.zip
            dist/Qt-6.12.0-Corresponding-Sources.zip
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          name: signed-release
          if-no-files-found: error
          path: dist/release/*
